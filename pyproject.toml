[project]
name = "apm-orchestrator"
version = "0.1.0"
description = "APM Orchestrator — the avatar + multi-agent reasoning layer (Supervisor + business-process agents) that calls the apm_connectors /tools/* API. Holds all reasoning; apm_connectors itself stays reasoning-free."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
# Durable per-case state: the Order-Renewal case graph and the poller
# that resumes it both need this -- see agents/order_renewal/case_graph.py
# and poller.py. Same libraries apm_connectors itself uses for its own
# (separate) approval-gate graph.
postgres = ["langgraph>=0.2", "langgraph-checkpoint-postgres>=2.0", "psycopg[binary,pool]>=3.2"]

[project.scripts]
apm-orchestrator = "apm_orchestrator.cli:main"
apm-orchestrator-poller = "apm_orchestrator.poller:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
