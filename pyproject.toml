[project]
name = "apm-orchestrator"
version = "0.1.0"
description = "APM Orchestrator — the avatar + multi-agent reasoning layer (Supervisor + business-process agents) that calls the apm_connectors /tools/* API. Holds all reasoning; apm_connectors itself stays reasoning-free."
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "claude-agent-sdk>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
apm-orchestrator = "apm_orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
