# Order-Renewal agent policy: what makes something "a renewal", the SLA
# windows it works to, and what counts as a blocker. Data, not code, per
# docs/roadmap.md (apm_connectors repo): the next business agent should be
# a new policy file + a different toolbelt subset, not new plumbing.

# Gmail search query used to detect a renewal/complaint/escalation signal.
# Gmail search syntax (see apm_connectors docs/api-contract.md).
detection:
  gmail_query: "newer_than:14d (renewal OR renew OR \"contract expiring\" OR \"license expiring\")"
  max_results: 20

# SOQL used to look up the account/opportunity once a signal is matched.
# {account_domain} / {account_name} are filled in by the agent from the
# detected email. IsClosed/Account.Name are selected so the node can spot
# a past-due-but-still-open Opportunity and tie-break the fallback query
# below -- not just to report the values.
#
# Deliberately NOT "ORDER BY CloseDate ASC LIMIT 5" -- live-verified
# failure mode on a long-lived account: ascending order + a small LIMIT
# grabs the *oldest* handful of Opportunities ever recorded, which for
# an account with real history can silently exclude the one actually
# relevant to a renewal today. The node instead fetches a wide candidate
# set and picks whichever CloseDate is closest to today (past or
# future) in Python -- see _closest_to_today in case_graph.py.
salesforce:
  lookup_soql: >-
    SELECT Id, Name, StageName, CloseDate, Amount, AccountId, IsClosed, Account.Name
    FROM Opportunity
    WHERE Account.Name = '{account_name}'
    LIMIT 50
  # Used only when the exact-match query above returns nothing -- real
  # account names drift from an inbound email's version of them (a
  # trailing period, different capitalization) more often than they're
  # genuinely missing. LIKE alone isn't enough to act on, though: it also
  # matches unrelated sibling accounts (a UK/Singapore subsidiary whose
  # name merely contains the same substring) -- the node tie-breaks by
  # normalized-name equality, not by trusting every LIKE hit.
  fallback_lookup_soql: >-
    SELECT Id, Name, StageName, CloseDate, Amount, AccountId, IsClosed, Account.Name
    FROM Opportunity
    WHERE Account.Name LIKE '%{account_name}%'
    LIMIT 200

# A renewal is only actionable inside this window before the current
# contract's close/expiry date.
sla:
  renewal_window_days: 60
  # Days before expiry after which a renewal without human sign-off is
  # treated as at-risk and escalated rather than proposed normally.
  escalation_threshold_days: 14

# JQL used to check for tickets that should block sending a renewal
# notice or closing the Opportunity (e.g. an open support escalation
# against the same account).
#
# SETUP: "KAN" below is this deployment's own Jira project key, not a
# universal default -- if you're standing this up against a different
# Jira site, replace it with a real project key from *your* site before
# trusting this check for anything. Live-verified failure mode: a
# plausible-looking but fictional/wrong key here doesn't error, it just
# returns zero results forever, so this check silently reports "no
# blockers" on *every* account, permanently -- worse than a loud failure.
blocking_tickets:
  jql: >-
    project = KAN AND status not in (Done, Closed)
    AND summary ~ "{account_name}"
  # Any of these issue types/labels on a matching ticket blocks the
  # renewal until resolved. "Task" is included deliberately: a
  # live-verified real blocker (a high-priority, SLA-impacting support
  # issue) was filed as a plain "Task" with no labels, because not every
  # Jira site uses a dedicated escalation type. Since `jql` above already
  # narrows to open tickets whose summary mentions this account, erring
  # toward "an unclassified open ticket about this account blocks until
  # reviewed" is the safer default than silently missing it.
  #
  # "Escalation"/"Bug" used to be listed here too, on the same
  # plausible-sounding-but-unchecked basis that broke
  # customer_onboarding's own "Onboarding" issue type (see
  # FAILURES_AND_LESSONS_LEARNED.md's live-test-prep section). Live-checked
  # against this real Jira site's actual configured work types
  # (Space settings -> Work types): only Epic/Story/Task/Subtask exist
  # here, no "Escalation" or "Bug" -- removed rather than left as dead,
  # unverified config. If your own Jira site genuinely has a dedicated
  # escalation or bug type, check its real name (Project/Space settings
  # -> Work types) before adding it back here -- don't guess a plausible
  # one.
  blocking_issue_types: ["Task"]
  blocking_labels: ["renewal-blocker"]

# Where follow-up work for a renewal gets routed if it needs a partner
# or another internal team, per docs/roadmap.md: "a Jira project, not an
# ad hoc issue".
#
# SETUP: same caveat as blocking_tickets.jql above -- "KAN" below is
# this deployment's own project key, used for all three routes since
# this deployment only runs one real Jira project. Set every
# project_key below to one that actually exists in *your* Jira site (an
# invalid one here 400s only when a real proposal finally reaches it,
# not at startup); use different keys per route if your org actually
# routes partner-ops/enterprise-success work to separate projects.
follow_up_routing:
  default_project_key: "KAN"
  # Maps a detected keyword/account attribute to a specific Jira
  # project/component -- extend per real team/partner as they're onboarded.
  routes:
    - match: "partner_managed"
      project_key: "KAN"
    - match: "enterprise"
      project_key: "KAN"

# Reporting cadence (Excel), explicitly separate from and lower-stakes
# than the live workflow -- Salesforce stays the system of record.
reporting:
  workbook_sheet: "Renewals"
  address: "A1"

# Fields proposed on the Opportunity once a renewal call is scheduled and
# approved and the confirmation notice is sent and approved -- the
# "update the record of truth" step. Kept as data (not a hardcoded
# StageName guess) since real picklist values are specific to each
# Salesforce org.
record_update:
  fields_template:
    StageName: "Closed Won"

# Purchase-order intake (roadmap Phase 6.1). Only runs for a case started
# with a PO document (a Drive file id) -- a case without one skips this
# whole section and behaves exactly as before. The document is read via
# apm_connectors' /tools/drive/read and handed to the document-extraction
# A2A agent (document_extraction/); everything below is this agent's
# policy for what to do with the result, passed to that agent per request
# where it applies (it has no business policy of its own).
po_intake:
  # Any extracted field below this confidence -- or a required field that
  # wasn't found -- moves the A2A task to input-required and pauses this
  # case for a human to review the values (scripts/review_po_extraction.py).
  # Starting point, not a calibrated number: check it against
  # evals/run_po_extraction_eval.py's per-bucket accuracy before trusting it.
  min_field_confidence: 0.8
  required_fields: [account_name, po_number, amount, term_start, term_end]

  # Reconciliation against the Opportunity this case already selected
  # (verify_account_node). Any failed check routes the PO to a Jira ticket
  # for a human instead of updating Salesforce.
  reconciliation:
    # PO amount (pre-tax) vs Opportunity.Amount. Passes if within EITHER
    # tolerance.
    amount_tolerance_abs: 1.00
    amount_tolerance_pct: 0.0
    # PO term start vs Opportunity.CloseDate, in days either side. null
    # skips the check.
    term_start_max_days_from_close_date: 45
    # ISO 4217 code every PO must be in, e.g. "USD". null skips the check
    # -- which means a PO in a different currency with the same number
    # would pass the amount check. Set it to your org's corporate
    # currency (Setup -> Company Information) if it's single-currency.
    expected_currency: null

  # What a matching PO proposes on the Opportunity (extracted field ->
  # Salesforce field API name), approval-gated like every write.
  #
  # SETUP: standard Opportunity has no PO-number field. Replace the
  # placeholder with a real custom field from YOUR org (Setup -> Object
  # Manager -> Opportunity -> Fields & Relationships, e.g.
  # PO_Number__c) before using PO intake -- while it's still a
  # REPLACE_WITH_ placeholder, a matching PO stops the case with a clear
  # message instead of proposing a write that would 400 at approval time.
  record_fields:
    po_number: "REPLACE_WITH_OPPORTUNITY_PO_NUMBER_FIELD"

  # Where a mismatched or rejected PO goes. project_key null means
  # follow_up_routing.default_project_key above. "Task" is live-checked
  # against this deployment's Jira (see blocking_issue_types' comment).
  mismatch_ticket:
    project_key: null
    issue_type: "Task"
