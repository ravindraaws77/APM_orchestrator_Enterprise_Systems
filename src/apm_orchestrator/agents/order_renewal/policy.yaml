# Order-Renewal agent policy: what makes something "a renewal", the SLA
# windows it works to, and what counts as a blocker. Data, not code, per
# docs/roadmap.md (apm_connectors repo): the next business agent should be
# a new policy file + a different toolbelt subset, not new plumbing.

# Gmail search query used to detect a renewal/complaint/escalation signal.
# Gmail search syntax (see apm_connectors docs/api-contract.md).
detection:
  gmail_query: "newer_than:14d (renewal OR renew OR \"contract expiring\" OR \"license expiring\")"
  max_results: 20

# SOQL used to look up the account/opportunity once a signal is matched.
# {account_domain} / {account_name} are filled in by the agent from the
# detected email. IsClosed/Account.Name are selected so the node can spot
# a past-due-but-still-open Opportunity and tie-break the fallback query
# below -- not just to report the values.
#
# Deliberately NOT "ORDER BY CloseDate ASC LIMIT 5" -- live-verified
# failure mode on a long-lived account: ascending order + a small LIMIT
# grabs the *oldest* handful of Opportunities ever recorded, which for
# an account with real history can silently exclude the one actually
# relevant to a renewal today. The node instead fetches a wide candidate
# set and picks whichever CloseDate is closest to today (past or
# future) in Python -- see _closest_to_today in case_graph.py.
salesforce:
  lookup_soql: >-
    SELECT Id, Name, StageName, CloseDate, Amount, AccountId, IsClosed, Account.Name
    FROM Opportunity
    WHERE Account.Name = '{account_name}'
    LIMIT 50
  # Used only when the exact-match query above returns nothing -- real
  # account names drift from an inbound email's version of them (a
  # trailing period, different capitalization) more often than they're
  # genuinely missing. LIKE alone isn't enough to act on, though: it also
  # matches unrelated sibling accounts (a UK/Singapore subsidiary whose
  # name merely contains the same substring) -- the node tie-breaks by
  # normalized-name equality, not by trusting every LIKE hit.
  fallback_lookup_soql: >-
    SELECT Id, Name, StageName, CloseDate, Amount, AccountId, IsClosed, Account.Name
    FROM Opportunity
    WHERE Account.Name LIKE '%{account_name}%'
    LIMIT 200

# A renewal is only actionable inside this window before the current
# contract's close/expiry date.
sla:
  renewal_window_days: 60
  # Days before expiry after which a renewal without human sign-off is
  # treated as at-risk and escalated rather than proposed normally.
  escalation_threshold_days: 14

# JQL used to check for tickets that should block sending a renewal
# notice or closing the Opportunity (e.g. an open support escalation
# against the same account).
#
# ACTION NEEDED: "REPLACE_WITH_YOUR_SUPPORT_PROJECT_KEY" is not a real
# Jira project -- live-verified failure mode: a plausible-looking but
# fictional key here doesn't error, it just returns zero results
# forever, so this check silently reports "no blockers" on *every*
# account, permanently. That's worse than a loud failure. Set this to a
# real project key in your Jira site before trusting this check for
# anything.
blocking_tickets:
  jql: >-
    project = REPLACE_WITH_YOUR_SUPPORT_PROJECT_KEY AND status not in (Done, Closed)
    AND summary ~ "{account_name}"
  # Any of these issue types/labels on a matching ticket blocks the
  # renewal until resolved. "Task" is included deliberately, not just
  # "Escalation"/"Bug": a live-verified real blocker (a high-priority,
  # SLA-impacting support issue) was filed as a plain "Task" with no
  # labels, because not every Jira site uses a dedicated escalation
  # type. Since `jql` above already narrows to open tickets whose
  # summary mentions this account, erring toward "an unclassified open
  # ticket about this account blocks until reviewed" is the safer
  # default than silently missing it -- tune per your site's real
  # issue-type taxonomy once you have one.
  blocking_issue_types: ["Escalation", "Bug", "Task"]
  blocking_labels: ["renewal-blocker"]

# Where follow-up work for a renewal gets routed if it needs a partner
# or another internal team, per docs/roadmap.md: "a Jira project, not an
# ad hoc issue".
#
# ACTION NEEDED: same caveat as blocking_tickets.jql above -- these are
# placeholder examples, not real projects. Set every project_key below
# to one that actually exists in your Jira site (an invalid one here
# 400s only when a real proposal finally reaches it, not at startup).
follow_up_routing:
  default_project_key: "REPLACE_WITH_YOUR_DEFAULT_JIRA_PROJECT_KEY"
  # Maps a detected keyword/account attribute to a specific Jira
  # project/component -- extend per real team/partner as they're onboarded.
  routes:
    - match: "partner_managed"
      project_key: "REPLACE_WITH_YOUR_PARTNER_OPS_PROJECT_KEY"
    - match: "enterprise"
      project_key: "REPLACE_WITH_YOUR_ENTERPRISE_SUCCESS_PROJECT_KEY"

# Reporting cadence (Excel), explicitly separate from and lower-stakes
# than the live workflow -- Salesforce stays the system of record.
reporting:
  workbook_sheet: "Renewals"
  address: "A1"

# Fields proposed on the Opportunity once a renewal call is scheduled and
# approved and the confirmation notice is sent and approved -- the
# "update the record of truth" step. Kept as data (not a hardcoded
# StageName guess) since real picklist values are specific to each
# Salesforce org.
record_update:
  fields_template:
    StageName: "Closed Won"
