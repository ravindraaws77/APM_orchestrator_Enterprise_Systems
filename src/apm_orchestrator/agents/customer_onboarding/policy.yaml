# Customer-Onboarding agent policy: what counts as "a new customer to
# onboard", the SLA window to kick off within, and what blocks starting
# onboarding. Data, not code, mirroring order_renewal/policy.yaml's own
# shape and rationale (see docs/roadmap.md in apm_connectors: the next
# business agent should be a new policy file + a different toolbelt
# subset, not new plumbing).
#
# See ../../../../CUSTOMER_ONBOARDING_CONTRACT.md for the full design
# writeup and the record of which open questions were resolved and how.
# `policy.py` (loader), `case_graph.py` (detect/verify/act/record nodes)
# and `agent.py` (Claude Agent SDK loop, wired into supervisor.py) all
# read this file the same way order_renewal's do theirs.

# A new customer to onboard is detected from Salesforce directly (an
# Opportunity just closed as new business), not from Gmail like
# Order-Renewal -- onboarding starts from a CRM state change, not an
# inbound email. {account_name} is filled in by the agent, same
# convention as order_renewal's own SOQL templates.
#
# Live-checked against the real org during live-test prep (screenshot
# review of the actual Opportunity Type dropdown): the assumption that
# Type has 'New Business'/'Renewal' values was WRONG -- this org has
# Salesforce's plain standard set instead: 'New Customer', 'Existing
# Customer - Upgrade', 'Existing Customer - Replacement', 'Existing
# Customer - Downgrade'. 'New Customer' is the real-world stand-in:
# still a safe discriminator against any renewal/upgrade Opportunity,
# which would be tagged 'Existing Customer - *' instead. See
# CUSTOMER_ONBOARDING_CONTRACT.md's resolved decisions for the full
# correction -- don't reintroduce 'New Business' here without
# re-checking a real org's actual picklist values first.
#
# Deliberately NOT exact-match-only -- CLAUDE.md's non-negotiable rule
# (never match a Salesforce account by exact string equality alone,
# live-verified against order_renewal: a trailing period silently
# returned zero rows). detect_node falls back to fallback_soql on a
# miss and tie-breaks by normalized-name equality, same as
# order_renewal's verify_account_node.
detection:
  salesforce_new_customer_soql: >-
    SELECT Id, Name, StageName, CloseDate, Type, AccountId, Account.Name
    FROM Opportunity
    WHERE Account.Name = '{account_name}'
    AND StageName = 'Closed Won'
    AND Type = 'New Customer'
    LIMIT 50
  fallback_soql: >-
    SELECT Id, Name, StageName, CloseDate, Type, AccountId, Account.Name
    FROM Opportunity
    WHERE Account.Name LIKE '%{account_name}%'
    AND StageName = 'Closed Won'
    AND Type = 'New Customer'
    LIMIT 200
  max_results: 20

# Onboarding is only actionable within this window after the deal closed.
sla:
  onboarding_window_days: 14
  # Days after close with no onboarding kicked off before it's treated
  # as at-risk and escalated rather than proposed normally -- same
  # escalation concept as order_renewal's escalation_threshold_days.
  escalation_threshold_days: 5

# SOQL used to pull the primary contact once the new customer is
# confirmed -- who the welcome email and kickoff invite actually go to.
# {account_id} is the AccountId from the detection query above.
salesforce:
  primary_contact_soql: >-
    SELECT Id, Name, Email, Title
    FROM Contact
    WHERE AccountId = '{account_id}'
    LIMIT 5

# JQL used to check whether onboarding has already been kicked off for
# this account -- blocks proposing a second kickoff call/welcome email
# for the same customer if this case gets re-triggered. Same shape as
# order_renewal's blocking_tickets.
#
# Deliberately points at the SAME placeholder string as
# order_renewal/policy.yaml's own blocking_tickets.jql
# (REPLACE_WITH_YOUR_SUPPORT_PROJECT_KEY) rather than a new
# onboarding-specific one: this portfolio runs both agents against one
# real Jira project, so filling in that one placeholder (a single
# find-and-replace across both policy.yaml files) covers both agents at
# once. Point this at a different real project instead if onboarding
# ever gets routed to its own Jira project.
#
# ACTION NEEDED: same live-verified failure mode as order_renewal's own
# blocking_tickets.jql -- REPLACE_WITH_... below is not a real Jira
# project. An invalid key here won't error; it will just silently
# report "no existing onboarding" every time, forever. Set this to a
# real project key in your Jira site before trusting this check.
blocking_tickets:
  jql: >-
    project = REPLACE_WITH_YOUR_SUPPORT_PROJECT_KEY AND status not in (Done, Closed)
    AND summary ~ "{account_name}"
  # "Onboarding" isn't a real issue type in a standard Jira Kanban-template
  # project (live-checked: only Task/Bug/Story/Epic exist by default) --
  # "Task" alone is the one guaranteed to exist, same reasoning as
  # order_renewal's own blocking_issue_types comment on erring toward an
  # unclassified open ticket blocking until reviewed.
  blocking_issue_types: ["Task"]
  blocking_labels: ["onboarding-in-progress"]

# Best-effort: pull an existing welcome-packet/kickoff-checklist template
# from Drive before proposing the kickoff call -- never blocks the case
# if missing, same as order_renewal's pull_contract step.
kickoff_packet:
  drive_name_contains: "Onboarding Checklist"

# Proposed steps, each behind its own separate human approval -- same
# propose -> wait_for_approval -> next shape as order_renewal's
# propose_call/propose_notice/propose_record_update.
kickoff_call:
  title_template: "Welcome & kickoff: {account_name}"
  duration_minutes: 45

welcome_notice:
  subject_template: "Welcome to APM, {account_name}!"

# Tracks onboarding progress as a real Jira ticket in the onboarding
# team's own project -- never an ad hoc issue, same rationale as
# order_renewal's follow_up_routing (which, per the Coverage Map, exists
# in that policy but was never wired into that graph -- this agent's
# baseline makes tracking a first-class proposed step from the start).
#
# Same placeholder-reuse rationale as blocking_tickets.jql above: this
# points at order_renewal's own default routing project
# (REPLACE_WITH_YOUR_DEFAULT_JIRA_PROJECT_KEY in
# order_renewal/policy.yaml's follow_up_routing), not a new,
# onboarding-only placeholder -- one real project key to fill in covers
# both agents. ACTION NEEDED: same caveat as blocking_tickets.jql above.
#
# issue_type is "Task", not "Onboarding" -- live-checked against a real
# Jira Kanban-template project (screenshot review during this session's
# live-test prep): it only has Task/Bug/Story/Epic configured, no
# "Onboarding" type. Creating this ticket with a made-up issue type
# would 400 on the real jira_create_issue call once approved. Change
# this only if your Jira site has genuinely added a real "Onboarding"
# (or similar) issue type.
onboarding_tracking:
  project_key: "REPLACE_WITH_YOUR_DEFAULT_JIRA_PROJECT_KEY"
  issue_type: "Task"

# Fields proposed on the Opportunity once the kickoff call and welcome
# notice are both approved -- marks onboarding as started. This writes
# to the SAME New-Business Opportunity record `detect_node` found --
# never the Account, mirroring order_renewal's own record_update
# (which also targets the Opportunity, not the Account). The two agents
# therefore never share or overwrite each other's status: order_renewal
# tracks a *separate* Renewal-type Opportunity's StageName later, this
# field is scoped to this one New-Business deal's onboarding lifecycle
# and is never read or reused by order_renewal. Onboarding_Status__c
# must carry the __c suffix -- Salesforce requires it on every custom
# field's API name, regardless of what the field is labeled in the UI.
record_update:
  fields_template:
    Onboarding_Status__c: "In Progress"
